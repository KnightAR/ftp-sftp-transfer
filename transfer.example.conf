# ============================================================
# transfer.conf — FTP to SFTP Transfer Configuration
#
# This file is sourced by transfer.sh at startup.
# IMPORTANT: Run "chmod 600 transfer.conf" to protect credentials.
# ============================================================

# === FTP Settings ===
FTP_HOST="ftp.example.com"
FTP_PORT="21"
FTP_USER="ftp_user"
FTP_PASS="ftp_password"
FTP_REMOTE_DIR="/"                        # Root of FTP — full tree will be mirrored

# === SFTP Settings ===
SFTP_HOST="sftp.example.com"
SFTP_PORT="22"
SFTP_USER="sftp_user"
SFTP_PASS="sftp_password"
SFTP_REMOTE_DIR="/ihub-db-backups"        # Destination root on SFTP server

# === Transfer Settings ===
RETENTION_DAYS=7                          # Files older than this (days) on FTP will be deleted
                                          # after confirmed upload to SFTP (based on FTP mtime)

FTP_MAX_WORKERS=2                         # Parallel FTP download workers.
                                          # Keep at or below the FTP server's max connection
                                          # limit (reserve at least 1 for listings/checks).

SFTP_MAX_WORKERS=10                       # Parallel SFTP upload workers.
                                          # Independent of FTP_MAX_WORKERS — tune to saturate
                                          # SFTP bandwidth. Check server's per-user connection
                                          # limit before increasing beyond 10.

# === Disk Space Management ===
DISK_SPACE_BUFFER_PCT=10                  # Percentage of total TEMP_DIR disk capacity to keep
                                          # in reserve at all times. Prevents the staging area
                                          # from filling the filesystem entirely.
                                          # e.g. 10 = keep 10% of total disk free as a buffer.

DISK_WAIT_TIMEOUT=300                     # Maximum seconds a download worker will wait for
                                          # sufficient disk space before skipping a file.
                                          # Note: if no downloads OR uploads are active at the
                                          # time of the check, the wait exits immediately
                                          # (nothing can free space — no point waiting).

DISK_WAIT_INTERVAL=10                     # Seconds between disk space re-checks while waiting.

# === Paths ===
TEMP_DIR=""                               # Leave empty to use system temp (/tmp/ftp_sftp_XXXXX)
                                          # Set an absolute path to use a custom staging folder
                                          # e.g. TEMP_DIR="/mnt/staging/ftp_transfer"
                                          # Ensure this filesystem has enough space to buffer
                                          # concurrent downloads (FTP_MAX_WORKERS x largest file).
EXCLUDE_LIST="./exclude.list"             # Path to exclusion list file
LOG_DIR="./logs"                          # Directory for general + error log files
LOG_RETENTION_DAYS=30                     # General transfer logs older than this are auto-deleted
                                          # Error logs (errors_YYYYMMDD.log) are NEVER auto-deleted

# === Behavior Flags ===
DRY_RUN="false"                           # "true" = simulate all actions, no files moved/deleted
DELETE_FROM_FTP="true"                    # "false" = disable FTP deletion entirely (transfer only)
OVERWRITE_ON_SIZE_DIFF="true"             # "false" = skip files with size mismatch instead of
                                          #           overwriting them on SFTP

# Note: TLS is disabled for this server (ftp:ssl-allow no).
# The server uses plain FTP with no TLS/FTPES support.